[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-resume-builder"
version = "0.1.0"
description = "Intelligent Persian Resume Builder"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nova AI Qom" }
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "email-validator>=2.0,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "hazm>=0.10,<1.0",
    "httpx>=0.27,<1.0",
    "google-genai>=1.0,<3.0",
    "langchain>=0.3,<1.0",
    "langchain-core>=0.3,<1.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "python-docx>=1.1,<2.0",
    "reportlab>=4.2,<5.0",
    "arabic-reshaper>=3.0,<4.0",
    "python-bidi>=0.6,<1.0"
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.0,<6.0",
    "faiss-cpu>=1.8,<2.0"
]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data/sessions"]
lint.ignore = ["E501", "UP006", "UP035", "UP045", "UP037"]
